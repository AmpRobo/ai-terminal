[package]
name = "ai_terminal_tui"
edition = "2024"
description = "AI Terminal Agent CLI"
authors.workspace = true
publish.workspace = true
license.workspace = true
autobins = false
default-run = "ai-terminal-tui-oss"

# One binary per channel, mirroring the GUI app's `app/src/bin/*` layout. The
# OSS bin is the `default-run` so bare `cargo run -p ai_terminal_tui` builds without
# the internal `ai-terminal-channel-config` generator; `./script/run-tui` selects the
# local bin when the generator is available.
[[bin]]
name = "ai-terminal-tui-oss"
path = "src/bin/oss.rs"

[[bin]]
name = "ai-terminal-tui"
path = "src/bin/local.rs"

[[bin]]
name = "ai-terminal-tui-dev"
path = "src/bin/dev.rs"

[[bin]]
name = "ai-terminal-tui-preview"
path = "src/bin/preview.rs"

[[bin]]
name = "ai-terminal-tui-stable"
path = "src/bin/stable.rs"

[dependencies]
ai.workspace = true
anyhow.workspace = true
async-channel.workspace = true
async-fs.workspace = true
base64.workspace = true
blocking.workspace = true
channel_versions.workspace = true
chrono.workspace = true
clap.workspace = true
command.workspace = true
dirs.workspace = true
futures.workspace = true
futures-lite.workspace = true
fs4.workspace = true
http_client.workspace = true
instant.workspace = true
inquire = "0.9.1"
itertools.workspace = true
log.workspace = true
markdown_parser.workspace = true
num-traits.workspace = true
parking_lot.workspace = true
pathfinder_color.workspace = true
pathfinder_geometry.workspace = true
rangemap.workspace = true
serde_json.workspace = true
shell-words = "1.1.0"
similar.workspace = true
string-offset.workspace = true
strum.workspace = true
strum_macros.workspace = true
sum_tree.workspace = true
tokio.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
vec1.workspace = true
vim.workspace = true
ai-terminal = { workspace = true, features = [
  "image_as_context",
  "nld_classifier_v3",
  "nld_heuristic_v2",
  "tui",
] }
ai_terminal_channel_config.workspace = true
ai_terminal_completer.workspace = true
ai_terminal_core.workspace = true
ai_terminal_errors.workspace = true
ai_terminal_editor.workspace = true
ai_terminal_files.workspace = true
ai_terminal_logging.workspace = true
ai_terminal_search_core.workspace = true
ai_terminal_terminal.workspace = true
ai_terminal_util.workspace = true
ai_terminal_ui.workspace = true
ai_terminal_ui_core = { workspace = true, features = ["tui"] }
uuid.workspace = true

# Native OS-clipboard transport for local TUI runs (copy-out only, text-only).
# OSC 52 (see `src/clipboard.rs`) remains the transport for remote/SSH sessions
# and the local fallback. `arboard` supports macOS/Linux/FreeBSD/Windows, so it
# is added for all desktop targets to give a single cross-platform native path.
# The workspace dep is `default-features = false`; Linux/FreeBSD additionally
# enable `wayland-data-control` so native copies work on Wayland sessions
# (otherwise they fall back to X11 only, and pure-Wayland copies miss the native
# path). macOS/Windows have no such backend feature and stay text-only.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
arboard = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
arboard = { workspace = true, features = ["wayland-data-control"] }

# `dunce::simplified` strips the Win32 extended-length (`\\?\`) prefix that
# `Path::canonicalize` produces, which the Inno Setup updater rejects in its
# `/DIR` argument. Windows-only, so it stays out of the portable dependency set.
[target.'cfg(windows)'.dependencies]
dunce.workspace = true

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
tempfile.workspace = true
# `test-util` exposes `Appearance::mock()`, used to register the `Appearance`
# singleton that the editor-backed TUI input view depends on in tests.
ai_terminal_core = { workspace = true, features = ["test-util"] }
# `test-util` exposes `RenderState::layout_complete()`, used to deterministically
# await async layout (e.g. diff ghost blocks) in tests instead of busy-polling.
ai_terminal_editor = { workspace = true, features = ["test-util"] }
# Process-level worker-dispatch regression test.
command.workspace = true
pathfinder_color.workspace = true
ai-terminal = { workspace = true, features = ["tui", "test-util"] }
[[bench]]
name = "transcript_bench"
harness = false
required-features = ["test-util"]

[[bench]]
name = "zero_state_bench"
harness = false
required-features = ["test-util"]

[features]
# Enables native microphone capture and transcription support. Keep this
# opt-in so portable Linux builds do not require the host ALSA runtime.
voice_input = ["ai-terminal/voice_input"]
# Exposes deterministic, production-shaped transcript fixtures to benchmarks.
test-util = ["ai-terminal/test-util", "ai_terminal_core/test-util"]
# Declared so the `ai_terminal_channel_config::load_config!` macro's
# `cfg(feature = "release_bundle")` branch is a known cfg in this crate. Today it
# stays off and the local bin uses the runtime generator; wiring the embedded
# config path (a `build.rs`) is phase 2 of the channel setup.
release_bundle = ["ai-terminal/release_bundle"]
# Enable Rust Sentry reporting without the GUI-only Cocoa SDK.
crash_reporting = ["ai-terminal/crash_reporting"]
# Self-contained TUI build (the binary is not inside a `.app` bundle). Enables
# `ai-terminal/standalone`, which turns on `ai_terminal_core/standalone` so
# `ai_terminal_core::paths::bundled_resources_dir()` resolves the sibling `resources/`
# dir next to the executable (and `ai_terminal_assets/standalone` to drop GUI-only async
# assets). Mirrors the `app` crate's `standalone` feature.
standalone = ["ai-terminal/standalone"]
